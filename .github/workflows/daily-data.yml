name: 更新今日班表

on:
    schedule:
        - cron: "30 4 * * *"
          timezone: "Asia/Taipei"
    workflow_dispatch:

concurrency:
    group: daily-timetable
    cancel-in-progress: false

permissions:
    contents: write
    actions: read

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: 檢查手動更新次數
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  today=$(TZ=Asia/Taipei date +%Y-%m-%d)
                  count=$(gh run list --workflow daily-data.yml --event workflow_dispatch --limit 20 --json createdAt --jq "[.[] | select((.createdAt | fromdateiso8601 + 28800 | strftime(\"%Y-%m-%d\")) == \"$today\")] | length")
                  if [ "$count" -gt 2 ]; then
                      echo "今天已達兩次手動更新上限。"
                      exit 1
                  fi
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: 取得並整理今日班表
              env:
                  TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
                  TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
              run: npm run data:generate
            - run: npm test
            - run: npm run build
            - name: 提交更新資料
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/data/today.json
                  git diff --cached --quiet && exit 0
                  git commit -m "data: 更新今日班表"
                  git push
